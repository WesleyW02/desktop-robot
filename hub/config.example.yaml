# =====================================================
# 桌面机器人 Agent Hub 配置模板
# 用法：复制本文件为项目根目录 config.yaml，按需修改。
# 说明：config.yaml 已被 .gitignore 排除，不会上传 GitHub。
# 敏感信息（API Key）建议填 config.yaml 或环境变量，不硬编码进代码。
# =====================================================

# ---- MiniMax（Token Plan）----
minimax:
  # API Key 两种填法（二选一）：
  #   A. 填在下方 api_key 字段（推荐，随 config.yaml 本地保存）
  #   B. 环境变量：set MINIMAX_API_KEY=sk-xxx（api_key 留空）
  api_key: ""                       # ← 填你的 Key，如 "sk-xxxx"
  api_key_env: MINIMAX_API_KEY
  base_url: https://api.minimaxi.com/v1
  model_chat: MiniMax-M3        # 对话+工具调用（按平台实际模型名调整）
  model_tts: speech-2.8-hd      # 语音合成
  model_asr: minimax-asr-01     # 语音转写
  tts_voice: female-shaonv      # 音色（可选：male-qn-qingse 等）

# ---- 串口（Phase 1 起使用，板子到手后填）----
serial:
  port: COM3                    # Windows 设备管理器查看实际 COM 口
  baudrate: 921600

# ---- 应用白名单（Phase 3 起使用，voice 工具只能操作这里登记的应用）----
apps:
  workbuddy:
    name: WorkBuddy
    path: C:\path\to\WorkBuddy.exe   # ← 填实际路径
    window_title: WorkBuddy           # 窗口标题关键词（type_to_app 用）
  notepad:
    name: 记事本
    path: notepad.exe
    window_title: ["记事本", "Notepad", "编辑器"]   # 中英文系统兼容
  calculator:
    name: 计算器
    path: calc.exe
    window_title: ["计算器", "Calculator"]
  chrome:
    name: Chrome 浏览器
    path: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
    window_title: Chrome
  explorer:
    name: 资源管理器
    path: explorer.exe
    window_title: ["资源管理器", "File Explorer", "文件资源管理器"]

# ---- 命令白名单（Phase 3 起使用，shell 工具只能执行这里的命令前缀）----
# 默认只放只读命令；写操作命令（del / rm / git push 等）需谨慎评估后添加
commands:
  - git status
  - git log
  - dir
  - tasklist

# ---- MCP 服务器（Phase 3 扩展，Agent 动态加载的外部工具）----
# stdio 型：command + args 启动本地进程；或 url 连远程 SSE/HTTP 服务器
# 工具自动注册为 mcp_<服务器名>_<工具名>，与内置工具同等可用
mcp:
  servers:
    test_server:                          # 演示服务器（hub/test_mcp_server.py）
      command: python
      args: ["-u", "hub/test_mcp_server.py"]
    filesystem:                           # 文件系统服务器（hub/mcp_filesystem.py，只读）
      command: python
      args: ["-u", "hub/mcp_filesystem.py"]
    # github:
    #   url: "http://localhost:8080/mcp"

# ---- RAG 知识库（Agent 基于文档回答问题）----
# 支持格式：md/txt/yaml/py/json/ino/cpp/h/html + pdf/docx（自动解析）
rag:
  docs_dir: "D:/个人工作台/桌面机器人"      # 文档根目录（递归扫描）
  exts: [".md", ".txt", ".yaml", ".yml", ".py", ".json", ".ino", ".cpp", ".h", ".html", ".pdf", ".docx"]
